<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Pokédex interativa com informações, evoluções e fraquezas dos Pokémon."
    />

    <meta id="theme-color" name="theme-color" content="#f7f8fa" />

    <!-- ===================================================
         FAVICONS / PWA
         =================================================== -->

    <link rel="icon" href="./favicon.ico" sizes="any" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />

    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- ===================================================
         FONTS
         =================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ===================================================
         STYLES — BASE
         =================================================== -->

    <link rel="stylesheet" href="./css/base.css" />

    <!-- ===================================================
         STYLES — HOME
         =================================================== -->

    <link rel="stylesheet" href="./css/components/pokemon-card.css" />

    <link rel="stylesheet" href="./css/components/pokemon-search.css" />

    <link rel="stylesheet" href="./css/components/pokemon-generation.css" />

    <link rel="stylesheet" href="./css/components/pokemon-filters.css" />

    <link rel="stylesheet" href="./css/components/favorites-link.css" />

    <!-- ===================================================
         STYLES — FAVORITES
         =================================================== -->

    <link rel="stylesheet" href="./css/components/favorites.css" />

    <!-- ===================================================
         STYLES — POKÉMON DETAIL
         =================================================== -->

    <link rel="stylesheet" href="./css/components/pokemon-detail/detail.css" />

    <link rel="stylesheet" href="./css/components/pokemon-detail/hero.css" />

    <link rel="stylesheet" href="./css/components/pokemon-detail/content.css" />

    <link rel="stylesheet" href="./css/components/pokemon-detail/facts.css" />

    <link
      rel="stylesheet"
      href="./css/components/pokemon-detail/weaknesses.css"
    />

    <link
      rel="stylesheet"
      href="./css/components/pokemon-detail/evolution.css"
    />

    <link rel="stylesheet" href="./css/components/pokemon-detail/states.css" />

    <title>Pokédex</title>
  </head>

  <body>
    <div id="app">
      <main id="main-content"></main>
    </div>

    <aside
      class="orientation-warning"
      role="dialog"
      aria-modal="true"
      aria-labelledby="orientation-warning-title"
      aria-describedby="orientation-warning-description"
    >
      <div class="orientation-warning__content">
        <h1 class="orientation-warning__title" id="orientation-warning-title">
          Gire o dispositivo
        </h1>

        <p
          class="orientation-warning__text"
          id="orientation-warning-description"
        >
          Para continuar explorando a Pokédex, use o dispositivo na posição
          vertical.
        </p>
      </div>
    </aside>

    <noscript>
      <p>Ative o JavaScript para utilizar a Pokédex.</p>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
